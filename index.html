<body class="bg-[#090714] text-slate-100 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 🔥 專屬雲端即時資料庫網址 (Firebase 新加坡伺服器)
    // ==========================================
    const FIREBASE_DB_URL = "https://tml2026-default-rtdb.asia-southeast1.firebasedatabase.app";
    // 🔐 團長隱藏重置密碼 (連點「全團即時動態」標題 5 下可呼叫重置視窗)
    const ADMIN_RESET_PIN = "2026";
    // 舊版測試假人 ID 清單（載入時自動從雲端清除）
    const LEGACY_DEMO_IDS = ['u1', 'u2', 'u4', 'u6', 'u7', 'u10'];

    // ==========================================
    // 園區固定集合點 (A~F點 + SOS) 與動態 DJ 時刻表
    // ==========================================
    const LANDMARKS = [
      {
        id: 'A',
        code: 'A點',
        codeEn: 'Point A',
        name: '主舞台左上方大樹',
        nameEn: 'Mainstage Left Hill Tree',
        stage: 'Mainstage',
        desc: 'Consciencia 主舞台階梯草坡左上方大樹下（每日 20:00 全團大合照點）',
        descEn: 'Upper-left grassy slope overlooking Mainstage (Daily 20:00 group photo spot)',
        badgeColor: 'from-amber-500 to-yellow-600',
        borderColor: 'border-amber-400',
        icon: '🏛️',
        mapX: 34,
        mapY: 22,
        lat: 12.9548,
        lng: 101.0168,
        schedule: {
          D1: [
            { start: '18:30', end: '19:45', dj: 'Lost Frequencies' },
            { start: '20:30', end: '21:45', dj: 'Dom Dolla' },

          ],
          D2: [

          ],
          D3: [

        }
      },
      {

        codeEn: 'Point B',
        name: 'Freedom 右側一樓吧台',

        stage: 'Freedom',
        desc: '巨型室內棚進門右手邊第一個吧台柱子旁（冷氣最涼、DnB 與 Anyma 主場）',
        descEn: 'Giant covered arena, 1st bar pillar on the right (Cool AC & 360 LED)',
        badgeColor: 'from-cyan-500 to-blue-600',
        borderColor: 'border-cyan-400',
        icon: '🦋',
        mapX: 76,

        lat: 12.9538,
        lng: 101.0206,
        schedule: {
          D1: [
            { start: '17:30', end: '18:45', dj: '1991' },
            { start: '19:00', end: '20:15', dj: 'Culture Shock' },
            { start: '21:30', end: '23:00', dj: 'Anyma (Genesys)' }
          ],
          D2: [
            { start: '17:00', end: '18:30', dj: 'Wilkinson' },
            { start: '20:00', end: '21:15', dj: 'Dimension' },
            { start: '21:15', end: '22:30', dj: 'Sub Focus' }
          ],
          D3: [
            { start: '21:00', end: '22:30', dj: 'WORSHIP' }

        }
      },
      {
        id: 'C',
        code: 'C點',
        codeEn: 'Point C',
        name: 'CORE 森林木棧道入口',
        nameEn: 'CORE Jungle Boardwalk',
        stage: 'CORE',
        desc: '西側山丘熱帶樹林 CORE 舞台，入口木棧道拱門右側圖騰柱旁',
        descEn: 'Western hillside forest stage, right totem by the boardwalk arch',
        badgeColor: 'from-emerald-500 to-teal-600',
        borderColor: 'border-emerald-400',
        icon: '🗿',
        mapX: 22,
        mapY: 53,
        lat: 12.9524,
        lng: 101.0155,
        schedule: {
          D1: [{ start: '20:00', end: '22:00', dj: 'Disclosure' }],
          D2: [{ start: '20:00', end: '22:00', dj: 'Bicep' }],
          D3: [{ start: '18:00', end: '19:30', dj: 'Keinemusik' }]
        }
      },
      {
        id: 'D',
        code: 'D點',
        codeEn: 'Point D',
        name: 'Atmosphere 帳篷正門 LED',
        nameEn: 'Atmosphere Tent Front LED',
        stage: 'Atmosphere',
        desc: '巨型馬戲團圓頂帳篷正門外右側 LED 時刻表看板下',
        descEn: 'Outside the circus tent entrance, right under the LED sign',
        badgeColor: 'from-purple-500 to-indigo-600',
        borderColor: 'border-purple-400',
        icon: '🎪',
        mapX: 28,
        mapY: 76,
        lat: 12.9508,
        lng: 101.0163,
        schedule: {
          D1: [{ start: '21:00', end: '23:00', dj: 'I Hate Models' }],
          D2: [{ start: '21:30', end: '23:00', dj: 'Amelie Lens' }],
          D3: [{ start: '21:00', end: '23:00', dj: '999999999' }]
        }
      },
      {
        id: 'E',
        code: 'E點',
        codeEn: 'Point E',
        name: '中央大湖美食街＆跨湖橋頭',
        nameEn: 'Lake Food Court & Bridge',
        stage: 'Food & Water',
        desc: 'Wisdom Lake 湖畔美食廣場、免費補水站與跨湖浮橋入口處',
        descEn: 'Central lakefront food court, free water refill & bridge entrance',
        badgeColor: 'from-pink-500 to-rose-600',
        borderColor: 'border-pink-400',
        icon: '🍹',
        mapX: 52,
        mapY: 54,
        lat: 12.9525,
        lng: 101.0182,
        quickTags: ['吃飯喝酒休息 / Chilling', '裝水補血 / Water Refill']
      },
      {
        id: 'F',
        code: 'F點',
        codeEn: 'Point F',
        name: '南大門・置物櫃 / 醫護 / 接駁車',
        nameEn: 'South Gate • Lockers & Shuttles',
        stage: 'Main Exit',
        desc: '南側正門 Lockers 置物櫃、醫護站與芭達雅接駁車總站（散場保底集合點）',
        descEn: 'South Gate Lockers, First Aid & Pattaya Shuttle terminal',
        badgeColor: 'from-slate-500 to-slate-700',
        borderColor: 'border-slate-400',
        icon: '🚌',
        mapX: 54,
        mapY: 88,
        lat: 12.9495,
        lng: 101.0183,
        quickTags: ['剛進場 / Just Arrived', '準備散場搭車 / Leaving']
      },
      {
        id: 'SOS',
        code: '🚑 求助',
        codeEn: '🚑 SOS',
        name: '緊急走失 / 需要支援',
        nameEn: 'Emergency / Need Help',
        stage: 'SOS',
        desc: '手機快沒電、身體不適或找不到路，點選後全員置頂警報！',
        descEn: 'Low battery or lost! Alerts everyone at the top!',
        badgeColor: 'from-red-600 to-rose-700',
        borderColor: 'border-red-500',
        icon: '🚨',
        mapX: 50,
        mapY: 8,
        lat: 12.9555,
        lng: 101.0184,
        quickTags: ['手機快沒電 / Low Battery', '身體不適或走失 / Need Help']
      }
    ];

    // 自動判斷今天為 D1(12/11) / D2(12/12) / D3(12/13)
    const getInitialFestivalDay = () => {
      const now = new Date();
      if (now.getMonth() === 11 && now.getDate() === 12) return 'D2';
      if (now.getMonth() === 11 && now.getDate() === 13) return 'D3';
      return 'D1';
    };

    // 判斷某時段是否為「正在表演 (NOW)」
    const isSlotPlayingNow = (slot, nowDate) => {
      const curMins = nowDate.getHours() * 60 + nowDate.getMinutes();
      const [sh, sm] = slot.start.split(':').map(Number);
      const [eh, em] = slot.end.split(':').map(Number);
      const startMins = sh * 60 + sm;
      const endMins = eh * 60 + em;
      return curMins >= startMins && curMins < endMins;
    };

    // 將 HH:MM 轉換為當天分鐘數（支援跨午夜 00:00~03:00）
    const timeToMins = (timeStr) => {
      const [h, m] = timeStr.split(':').map(Number);
      return (h < 6 ? h + 24 : h) * 60 + m;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('map'); // 'map' | 'friends' | 'guide'
      const [lang, setLang] = useState('zh');
      const [festivalDay, setFestivalDay] = useState(getInitialFestivalDay);

      // 從 localStorage 讀取個人暱稱，若無則引導設定
      const [myProfile, setMyProfile] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('tml_my_profile_prod'));
          if (saved && saved.name) return saved;
        } catch (e) {}
        return { name: '', partySize: 1 };
      });
      const [isEditingProfile, setIsEditingProfile] = useState(() => !myProfile.name);
      const [tempName, setTempName] = useState(myProfile.name);
      const [tempPartySize, setTempPartySize] = useState(myProfile.partySize || 1);

      // 定位名單（預設為空，載入時同步 Firebase 雲端並自動過濾舊測試假人）
      const [checkins, setCheckins] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('tml_checkins_prod'));
          if (Array.isArray(saved)) {
            return saved.filter(c => !LEGACY_DEMO_IDS.includes(c.id));
          }
        } catch (e) {}
        return [];
      });

      const [selectedLandmark, setSelectedLandmark] = useState('A');
      const [watchingDj, setWatchingDj] = useState('');
      const [statusNote, setStatusNote] = useState('');
      const [activeMapPinId, setActiveMapPinId] = useState(null);
      const [mapPinMode, setMapPinMode] = useState(false);
      const [mapStyle, setMapStyle] = useState('illustrated');
      const [customMapUrl, setCustomMapUrl] = useState('');
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [pearlAmount, setPearlAmount] = useState('10');
      const [showTaxiModal, setShowTaxiModal] = useState(false);
      const [guideSubTab, setGuideSubTab] = useState('web');
      const [cloudSyncStatus, setCloudSyncStatus] = useState('connecting');
      const [nowTick, setNowTick] = useState(Date.now());

      // 團長隱藏重置密碼控制
      const [secretTapCount, setSecretTapCount] = useState(0);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');

      useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 30000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        localStorage.setItem('tml_checkins_prod', JSON.stringify(checkins));
      }, [checkins]);

      useEffect(() => {
        if (myProfile.name) {
          localStorage.setItem('tml_my_profile_prod', JSON.stringify(myProfile));
        }
      }, [myProfile]);

      // ==========================================
      // 🌐 跨手機雲端 0 秒即時同步（並自動清理舊測試假人）
      // ==========================================
      const fetchCloudCheckins = async () => {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/checkins.json`);
          if (!res.ok) throw new Error('Network error');
          const data = await res.json();
          if (data && typeof data === 'object') {
            const entries = Object.entries(data).filter(([, v]) => Boolean(v));
            const demoKeys = entries.filter(([k, v]) => LEGACY_DEMO_IDS.includes(k) || LEGACY_DEMO_IDS.includes(v?.id));
            if (demoKeys.length > 0) {
              demoKeys.forEach(([k]) => {
                fetch(`${FIREBASE_DB_URL}/checkins/${encodeURIComponent(k)}.json`, { method: 'DELETE' }).catch(() => {});
              });
            }
            const realList = entries
              .filter(([k, v]) => !LEGACY_DEMO_IDS.includes(k) && !LEGACY_DEMO_IDS.includes(v?.id))
              .map(([, v]) => v);
            setCheckins(realList.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)));
          } else {
            setCheckins([]);
          }
          setCloudSyncStatus('live');
        } catch (err) {
          console.warn('Cloud sync fallback to local:', err);
          setCloudSyncStatus('offline');
        }
      };

      useEffect(() => {
        fetchCloudCheckins();
        let evtSource = null;
        try {
          evtSource = new EventSource(`${FIREBASE_DB_URL}/checkins.json`);
          evtSource.addEventListener('put', () => fetchCloudCheckins());
          evtSource.addEventListener('patch', () => fetchCloudCheckins());
          evtSource.onerror = () => setCloudSyncStatus('offline');
        } catch (e) {
          console.warn('SSE fallback to polling');
        }

        const pollTimer = setInterval(fetchCloudCheckins, 8000);
        return () => {
          if (evtSource) evtSource.close();
          clearInterval(pollTimer);
        };
      }, []);

      const t = (zh, en) => (lang === 'en' ? en : zh);
      const getLmCode = (lm) => (lang === 'en' ? (lm?.codeEn || lm?.code) : lm?.code);
      const getLmName = (lm) => (lang === 'en' ? (lm?.nameEn || lm?.name) : lm?.name);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
      };

      const formatExactTime = (ts) => {
        if (!ts) return '--:--';
        return new Date(ts).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      };

      const formatTimeAgo = (ts) => {
        if (!ts) return t('剛剛', 'Just now');
        const mins = Math.max(0, Math.floor((nowTick - ts) / 60000));
        if (mins < 1) return t('剛剛', 'Just now');
        if (mins < 60) return t(`${mins}分前`, `${mins}m ago`);
        return t(`${Math.floor(mins / 60)}小時前`, `${Math.floor(mins / 60)}h ago`);
      };

      // 執行打卡定位
      const handleCheckIn = async (landmarkIdOverride, customCoords = null) => {
        if (!myProfile.name.trim()) {
          setIsEditingProfile(true);
          showToast(t('⚠️ 請先輸入你的名字或 IG 再打卡！', '⚠️ Please enter your name first!'));
          return;
        }

        const targetId = landmarkIdOverride || selectedLandmark;
        const lm = LANDMARKS.find(l => l.id === targetId) || LANDMARKS[0];
        const safeKey = `user_${myProfile.name.trim().replace(/[.#$/\[\]\s]/g, '_')}`;

        const newEntry = {
          id: safeKey,
          name: myProfile.name.trim(),
          partySize: myProfile.partySize || 1,
          landmarkId: targetId,
          watchingDj: watchingDj.trim(),
          mapX: customCoords?.mapX ?? lm.mapX,
          mapY: customCoords?.mapY ?? lm.mapY,
          isCustomPin: Boolean(customCoords?.isCustomPin),
          lat: customCoords?.lat || lm.lat,
          lng: customCoords?.lng || lm.lng,
          note: statusNote.trim() || (watchingDj ? `🎧 正在看 ${watchingDj}` : t('剛抵達這邊！', 'Just arrived here!')),
          updatedAt: Date.now()
        };

        setCheckins(prev => [newEntry, ...prev.filter(c => c.id !== safeKey && c.name !== newEntry.name)]);
        setActiveMapPinId(safeKey);
        setMapPinMode(false);
        setStatusNote('');
        showToast(t(`📍 已同步定位在【${lm.code} ${lm.name}】！`, `📍 Synced at [${lm.codeEn}]!`));

        try {
          await fetch(`${FIREBASE_DB_URL}/checkins/${encodeURIComponent(safeKey)}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newEntry)
          });
          setCloudSyncStatus('live');
        } catch (err) {
          console.error('Cloud write error:', err);
          setCloudSyncStatus('offline');
        }
      };

      // 個人離場：僅清除「自己」的地圖定位（不影響其他 34 人）
      const handleRemoveMyCheckin = async () => {
        if (!myProfile.name.trim()) return;
        const safeKey = `user_${myProfile.name.trim().replace(/[.#$/\[\]\s]/g, '_')}`;
        setCheckins(prev => prev.filter(c => c.id !== safeKey && c.name !== myProfile.name.trim()));
        if (activeMapPinId === safeKey) setActiveMapPinId(null);
        showToast(t('👋 已將你的定位從地圖移除（不影響其他隊友）', '👋 Removed your pin from the map'));

        try {
          await fetch(`${FIREBASE_DB_URL}/checkins/${encodeURIComponent(safeKey)}.json`, {
            method: 'DELETE'
          });
        } catch (e) {
          console.error(e);
        }
      };

      // 團長專用密碼重置（需連點標題 5 下＋輸入密碼 2026 才能全清）
      const handleAdminResetAll = async (e) => {
        e.preventDefault();
        if (adminPinInput.trim() !== ADMIN_RESET_PIN) {
          showToast(t('❌ 團長密碼錯誤，無法清空全團資料！', '❌ Wrong Admin PIN!'));
          return;
        }
        setCheckins([]);
        setActiveMapPinId(null);
        setShowAdminModal(false);
        setAdminPinInput('');
        try {
          await fetch(`${FIREBASE_DB_URL}/checkins.json`, { method: 'DELETE' });
          showToast(t('🧹 團長驗證通過，已清空全團舊紀錄！', '🧹 Admin verified. All check-ins cleared!'));
        } catch (err) {
          console.error(err);
        }
      };

      // 手機真實 GPS 定位
      const handleGpsLocate = () => {
        if (!navigator.geolocation) {
          showToast(t('⚠️ 不支援 GPS，請直接點選 A~F 點', '⚠️ GPS not supported'));
          return;
        }
        showToast(t('🛰️ 正在取得手機 GPS 座標...', '🛰️ Getting GPS coordinates...'));
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            let closest = LANDMARKS[0];
            let minD = Infinity;
            LANDMARKS.filter(l => l.id !== 'SOS').forEach(l => {
              const d = Math.hypot(l.lat - latitude, l.lng - longitude);
              if (d < minD) { minD = d; closest = l; }
            });
            handleCheckIn(closest.id, {
              lat: Number(latitude.toFixed(6)),
              lng: Number(longitude.toFixed(6)),
              mapX: closest.mapX,
              mapY: closest.mapY
            });
          },
          () => showToast(t('⚠️ 無法取得 GPS，請直接點 A~F 點打卡', '⚠️ GPS denied, tap Point A~F')),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // 點擊地圖任意處插旗
      const handleMapClick = (e) => {
        if (!mapPinMode) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        let nearest = LANDMARKS[0];
        let minD = Infinity;
        LANDMARKS.filter(l => l.id !== 'SOS').forEach(l => {
          const d = Math.hypot(l.mapX - x, l.mapY - y);
          if (d < minD) { minD = d; nearest = l; }
        });
        handleCheckIn(nearest.id, { mapX: x, mapY: y, isCustomPin: true });
      };

      // 一鍵複製文字貼 LINE / IG
      const copyLineText = (mode = 'me') => {
        const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        let text = '';
        if (mode === 'me') {
          const mine = checkins.find(c => c.name === myProfile.name);
          if (!mine && !myProfile.name) {
            showToast(t('⚠️ 請先設定名字並打卡後再複製！', '⚠️ Please check in first!'));
            return;
          }
          const lm = LANDMARKS.find(l => l.id === (mine?.landmarkId || selectedLandmark));
          const djStr = mine?.watchingDj ? `\n🎧 正在看 (DJ): ${mine.watchingDj}` : '';
          const sizeStr = (mine?.partySize || myProfile.partySize || 1) > 1 ? ` (+${(mine?.partySize || myProfile.partySize) - 1}人)` : '';
          text = `📍【TML 定位回報 ${timeStr}】\n🙋‍♂️ ${myProfile.name || 'Me'}${sizeStr}\n📌 地點: ${lm.code} (${lm.name} / ${lm.nameEn})${djStr}\n💬 備註: ${mine?.note || '在附近！'}\n🗺️ Google Maps: https://www.google.com/maps?q=${mine?.lat || lm.lat},${mine?.lng || lm.lng}`;
        } else {
          if (checkins.length === 0) {
            showToast(t('目前還沒有人打卡喔！', 'No check-ins yet!'));
            return;
          }
          const lines = [`🇹🇭【Tomorrowland 全團定位總整理 ${timeStr}】`];
          LANDMARKS.forEach(lm => {
            const list = checkins.filter(c => c.landmarkId === lm.id);
            if (list.length > 0) {
              const count = list.reduce((s, p) => s + (p.partySize || 1), 0);
              const names = list.map(p => {
                const s = p.partySize > 1 ? `+${p.partySize - 1}` : '';
                const d = p.watchingDj ? `[🎧${p.watchingDj}]` : '';
                return `${p.name}${s}${d}(${formatExactTime(p.updatedAt)})`;
              }).join('、');
              lines.push(`\n${lm.icon}【${lm.code} / ${lm.codeEn}】${lm.name} (約${count}人)\n👉 ${names}`);
            }
          });
          text = lines.join('\n');
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(t('📋 已複製！直接貼到 LINE 或 IG 群組即可！', '📋 Copied! Paste to LINE or IG!'));
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      };

      const fallbackCopy = (text) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(t('📋 已複製！直接貼到 LINE 或 IG 群組即可！', '📋 Copied! Paste to LINE or IG!'));
      };

      const totalHeadcount = useMemo(() => checkins.reduce((s, c) => s + (c.partySize || 1), 0), [checkins]);
      const sosPeople = useMemo(() => checkins.filter(c => c.landmarkId === 'SOS'), [checkins]);
      const currentLmObj = LANDMARKS.find(l => l.id === selectedLandmark) || LANDMARKS[0];
      const hasMyCheckin = useMemo(() => checkins.some(c => c.name === myProfile.name.trim()), [checkins, myProfile.name]);

      // 依日期與目前時間自動鎖定「現在正在演 (NOW) + 下兩個時段 (NEXT 1 & NEXT 2)」
      const dynamicDjOptions = useMemo(() => {
        if (!currentLmObj.schedule) {
          return (currentLmObj.quickTags || []).map(tag => ({
            label: tag,
            value: tag,
            badge: null,
            isNow: false
          }));
        }
        const daySlots = [...(currentLmObj.schedule[festivalDay] || [])].sort(
          (a, b) => timeToMins(a.start) - timeToMins(b.start)
        );
        const nowDate = new Date(nowTick);
        const rawCurMins = nowDate.getHours() * 60 + nowDate.getMinutes();
        const curMins = rawCurMins < 6 ? rawCurMins + 24 * 60 : rawCurMins;

        // 找出目前正在演出的場次索引，或下一場即將開始的場次索引
        const playingIdx = daySlots.findIndex(
          slot => curMins >= timeToMins(slot.start) && curMins < timeToMins(slot.end)
        );

        let targetSlice = [];
        if (playingIdx !== -1) {
          // 正在演出 + 下兩個時段 (共 3 場)
          targetSlice = daySlots.slice(playingIdx, playingIdx + 3).map((slot, idx) => ({
            ...slot,
            badge: idx === 0 ? 'NOW' : idx === 1 ? 'NEXT 1' : 'NEXT 2',
            isNow: idx === 0
          }));
        } else {
          // 若目前在第一場之前（白天剛進場），顯示接下來即將登場的前 3 個時段
          const upcomingIdx = daySlots.findIndex(slot => timeToMins(slot.start) > curMins);
          const startIdx = upcomingIdx !== -1 ? upcomingIdx : Math.max(0, daySlots.length - 3);
          targetSlice = daySlots.slice(startIdx, startIdx + 3).map((slot, idx) => ({
            ...slot,
            badge: upcomingIdx !== -1 ? `NEXT ${idx + 1}` : null,
            isNow: false
          }));
        }

        return targetSlice.map(slot => ({
          ...slot,
          label: `${slot.start}-${slot.end} ${slot.dj}`,
          value: `${slot.dj} (${slot.start})`
        }));
      }, [currentLmObj, festivalDay, nowTick]);

      return (

                    {LANDMARKS.map(lm => (
                      <button
                        key={lm.id}
                        onClick={() => {
                          setSelectedLandmark(lm.id);
                          setWatchingDj('');
                        }}
                        className={`p-2 rounded-xl border text-left transition ${
                          selectedLandmark === lm.id
                            ? 'bg-amber-500/20 border-amber-400 ring-1 ring-amber-400'
                            : lm.id === 'SOS'
                            ? 'bg-red-950/40 border-red-500/40'
                            : 'bg-slate-950 border-slate-800'
                        }`}
                      >
                        <div className="text-[11px] font-black text-white">
                          {lm.icon} {getLmCode(lm)}
                        </div>
                        <div className="text-[10px] text-slate-400 truncate mt-0.5">{getLmName(lm)}</div>
                      </button>
                    ))}
                  </div>

                  {/* 第二步：依日期與時間自動聯動的 DJ 標籤 */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[11px] text-slate-400 truncate">
                        🎧 {t(`【${currentLmObj.code}】選擇正在看的 DJ / 狀態：`, `[${currentLmObj.codeEn}] Select DJ / Status:`)}
                      </span>
                      {currentLmObj.schedule && (
                        <div className="flex items-center gap-1 bg-slate-950 p-0.5 rounded-lg border border-slate-800 shrink-0">
                          {[
                            { id: 'D1', label: 'D1 12/11' },
                            { id: 'D2', label: 'D2 12/12' },
                            { id: 'D3', label: 'D3 12/13' }
                          ].map(d => (
                            <button
                              key={d.id}
                              type="button"
                              onClick={() => {
                                setFestivalDay(d.id);
                                setWatchingDj('');
                              }}
                              className={`px-1.5 py-0.5 rounded text-[10px] font-extrabold transition ${
                                festivalDay === d.id ? 'bg-purple-500 text-white' : 'text-slate-400'
                              }`}
                            >
                              {d.label}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                      {dynamicDjOptions.map(opt => (
                        <button
                          key={opt.value}
                          type="button"
                          onClick={() => setWatchingDj(watchingDj === opt.value ? '' : opt.value)}
                          className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap border flex items-center gap-1.5 transition ${
                            watchingDj === opt.value
                              ? 'bg-purple-500 text-white border-purple-300 shadow'
                              : opt.isNow
                              ? 'bg-rose-950/70 text-rose-200 border-rose-500/60'
                              : 'bg-slate-950 text-slate-300 border-slate-800'
                          }`}
                        >
                          {opt.badge && (
                            <span
                              className={`px-1.5 py-0.5 rounded text-[9px] font-black ${
                                opt.isNow
                                  ? 'bg-rose-500 text-white animate-pulse'
                                  : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                              }`}
                            >
                              {opt.badge}
                            </span>
                          )}
                          <span>🎧 {opt.label}</span>
                        </button>
                      ))}
                    </div>

                    {currentLmObj.schedule && (
                      <input
                        type="text"
                        value={watchingDj}
                        onChange={e => setWatchingDj(e.target.value)}
                        placeholder={t('或直接輸入其他 DJ 名稱（選填）...', 'Or type custom DJ name (optional)...')}
                        className="w-full px-3 py-1.5 rounded-xl bg-slate-950/70 border border-slate-800 text-[11px] text-purple-200 placeholder-slate-500 focus:outline-none focus:border-purple-400"
                      />
                    )}
                  </div>

                  {/* 第三步：一句話備註 + 立即打卡按鈕 */}
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={statusNote}
                      onChange={e => setStatusNote(e.target.value)}
                      placeholder={t('補充備註（例：拿台灣國旗、在吧台旁）...', 'Optional note...')}
                      className="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                    />
                    <button
                      onClick={() => handleCheckIn(selectedLandmark)}
                      className={`px-4 py-2 rounded-xl font-black text-xs shrink-0 shadow-lg active:scale-95 ${
                        selectedLandmark === 'SOS'
                          ? 'bg-red-600 text-white'
                          : 'bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950'
                      }`}
                    >
                      📍 {t(`打卡 ${currentLmObj.code}`, `Pin ${currentLmObj.codeEn}`)}
                    </button>
                  </div>
                </section>
              </div>
            )}

            {/* ==========================================
                TAB 2: 👥 找隊友 & 各點即時清單
            ========================================== */}
            {activeTab === 'friends' && (
              <div className="space-y-3">
                <div className="p-3.5 rounded-3xl bg-slate-900 border border-slate-800 space-y-2.5">
                  <div className="flex items-center justify-between gap-2">
                    {/* 秘密入口：連點標題 5 下可開啟團長密碼重置視窗，防止一般人誤刪全團紀錄 */}
                    <span
                      onClick={() => {
                        const next = secretTapCount + 1;
                        if (next >= 5) {
                          setSecretTapCount(0);
                          setShowAdminModal(true);
                        } else {
                          setSecretTapCount(next);
                        }
                      }}
                      className="text-xs font-extrabold text-amber-300 cursor-pointer"
                    >
                      👥 {t(`全團即時動態 (${totalHeadcount}人)`, `Live Squad Status (${totalHeadcount})`)}
                    </span>

                    {/* 個人只能清除自己的定位（完全不影響其他人） */}
                    {hasMyCheckin && (
                      <button
                        onClick={handleRemoveMyCheckin}
                        className="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-rose-950 text-rose-300 border border-rose-500/30 transition"
                      >
                        👋 {t('移除我的定位', 'Clear My Pin')}
                      </button>
                    )}
                  </div>

                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder={t('🔍 搜尋朋友名字、A~F點或正在看的 DJ...', '🔍 Search friend name, Point A~F, or DJ...')}
                    className="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                  />

                  {checkins.length === 0 ? (
                    <div className="py-10 text-center space-y-2">
                      <div className="text-2xl">📍</div>
                      <p className="text-xs font-bold text-slate-300">
                        {t('目前還沒有任何隊友打卡', 'No squad members checked in yet')}
                      </p>
                      <p className="text-[11px] text-slate-500">
                        {t('切換到「定位地圖」按下你的集合點，全團都會同步看到！', 'Switch to Live Map to check in your location!')}
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {checkins
                        .filter(c => {
                          if (!searchQuery.trim()) return true;
                          const q = searchQuery.toLowerCase();
                          return (
                            c.name.toLowerCase().includes(q) ||
                            (c.watchingDj || '').toLowerCase().includes(q) ||
                            (c.note || '').toLowerCase().includes(q) ||
                            c.landmarkId.toLowerCase().includes(q)
                          );
                        })
                        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
                        .map(p => {
                          const lm = LANDMARKS.find(l => l.id === p.landmarkId) || LANDMARKS[0];
                          return (
                            <div key={p.id} className="p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2">
                              <div className="space-y-1 min-w-0">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <span className="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">
                                    {formatExactTime(p.updatedAt)}
                                  </span>
                                  <span className="text-xs font-black text-white">{p.name}</span>
                                  {(p.partySize || 1) > 1 && (
                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300">
                                      +{p.partySize - 1}{t('人', ' ppl')}
                                    </span>
                                  )}
                                  <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded bg-gradient-to-r ${lm.badgeColor} text-white`}>
                                    {lm.icon} {getLmCode(lm)} {getLmName(lm)}
                                  </span>
                                  {p.watchingDj && (
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-500/20 text-purple-200 border border-purple-500/30">
                                      🎧 {p.watchingDj}
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs text-slate-400 truncate">💬 {p.note}</p>
                              </div>
                              <button
                                onClick={() => {
                                  setActiveMapPinId(p.id);
                                  setActiveTab('map');
                                }}
                                className="shrink-0 px-2.5 py-1.5 rounded-xl bg-slate-900 text-amber-300 border border-slate-700 text-[11px] font-bold"
                              >
                                {t('看地圖', 'Map')}
                              </button>
                            </div>
                          );
                        })}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ==========================================
                TAB 3: 📖 TML 攻略網 & 現場工具
            ========================================== */}
            {activeTab === 'guide' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                  <button
                    onClick={() => setGuideSubTab('web')}
                    className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition ${
                      guideSubTab === 'web' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'
                    }`}
                  >
                    🌐 {t('瀏覽 tmlth-guide 完整攻略＆DJ表', 'tmlth-guide Web')}
                  </button>
                  <button
                    onClick={() => setGuideSubTab('tools')}
                    className={`flex-1 py-2 rounded-xl text-xs font-extrabold transition ${
                      guideSubTab === 'tools' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'
                    }`}
                  >
                    ⚡ {t('泰文司機卡＆Pearls換算器', 'Taxi Card & Pearls')}
                  </button>
                </div>

                {guideSubTab === 'web' ? (
                  <div className="rounded-3xl overflow-hidden border border-amber-500/40 bg-slate-900 shadow-2xl">
                    <div className="px-3 py-2 bg-slate-950 flex items-center justify-between text-xs">
                      <span className="text-slate-300 font-mono truncate">https://tmlth-guide.github.io/</span>
                      <a
                        href="https://tmlth-guide.github.io/"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-amber-300 font-bold underline shrink-0"
                      >
                        {t('開新視窗 ↗', 'Open Tab ↗')}
                      </a>
                    </div>
                    <iframe
                      title="TML TH Guide"
                      src="https://tmlth-guide.github.io/"
                      className="w-full h-[680px] border-0 bg-white"
                    />
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="p-4 rounded-3xl bg-slate-900 border border-amber-500/40 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <h3 className="text-xs font-black text-amber-300">🇹🇭 {t('給泰國計程車 / Grab 司機看的地址卡', 'Thai Driver Address Card')}</h3>
                        <button
                          onClick={() => setShowTaxiModal(true)}
                          className="px-2.5 py-1 rounded-xl bg-amber-400 text-slate-950 font-black text-[11px]"
                        >
                          🔍 {t('全螢幕放大', 'Full Screen')}
                        </button>
                      </div>
                      <div className="p-3 rounded-2xl bg-slate-950 border border-slate-800 space-y-1">
                        <div className="text-base font-black text-white">ไป วิสดอม แวลลีย์ (เขาไม้แก้ว บางละมุง พัทยา)</div>
                        <div className="text-xs text-amber-200">📍 Wisdom Valley, Khao Mai Kaew, Pattaya (Tomorrowland)</div>
                      </div>
                    </div>

                    <div className="p-4 rounded-3xl bg-slate-900 border border-cyan-500/30 space-y-2.5">
                      <div className="text-xs font-black text-cyan-300">💎 {t('Pearls 手環消費即時換算 (1 Pearl ≈ 65 泰銖)', 'Pearls Calculator')}</div>
                      <div className="grid grid-cols-3 gap-2">
                        <div className="p-2.5 rounded-xl bg-slate-950 border border-cyan-500/40">
                          <div className="text-[10px] text-cyan-300">Pearls</div>
                          <input
                            type="number"
                            value={pearlAmount}
                            onChange={e => setPearlAmount(e.target.value)}
                            className="w-full bg-transparent text-base font-black text-white focus:outline-none"
                          />
                        </div>
                        <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-center">
                          <div className="text-[10px] text-slate-400">{t('泰銖 THB', 'THB')}</div>
                          <div className="text-sm font-black text-amber-300 mt-0.5">฿ {Math.round((Number(pearlAmount) || 0) * 65)}</div>
                        </div>
                        <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-center">
                          <div className="text-[10px] text-slate-400">{t('台幣 TWD', 'TWD')}</div>
                          <div className="text-sm font-black text-emerald-300 mt-0.5">$ {Math.round((Number(pearlAmount) || 0) * 62)}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 團長隱藏密碼重置 Modal (連點「全團即時動態」5 下才會出現) */}
          {showAdminModal && (
            <div onClick={() => setShowAdminModal(false)} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <form
                onClick={e => e.stopPropagation()}
                onSubmit={handleAdminResetAll}
                className="w-full max-w-xs rounded-3xl bg-slate-900 border border-rose-500/50 p-5 space-y-3 shadow-2xl"
              >
                <div className="text-sm font-black text-rose-300">🔐 團長管理員重置</div>
                <p className="text-xs text-slate-400">
                  此操作會清空全團所有人的雲端定位紀錄（建議僅在隔日活動開始前使用）。請輸入團長密碼：
                </p>
                <input
                  type="password"
                  inputMode="numeric"
                  value={adminPinInput}
                  onChange={e => setAdminPinInput(e.target.value)}
                  placeholder="輸入密碼 (預設 2026)"
                  className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white text-center tracking-widest"
                />
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setShowAdminModal(false)}
                    className="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                  >
                    取消
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-black"
                  >
                    確認全清
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 全螢幕泰文司機卡 Modal */}
          {showTaxiModal && (
            <div onClick={() => setShowTaxiModal(false)} className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-3xl bg-amber-400 text-slate-950 p-6 space-y-3 border-4 border-white">
                <div className="text-xs font-black bg-slate-950 text-amber-300 px-3 py-1 rounded-full w-fit">SHOW TO THAI DRIVER</div>
                <div className="text-3xl font-black leading-tight">ไป วิสดอม แวลลีย์ (Wisdom Valley)</div>
                <div className="text-xl font-extrabold">ต.เขาไม้แก้ว อ.บางละมุง จ.ชลบุรี (พัทยา)</div>
                <div className="text-xs font-bold pt-2 border-t border-slate-950/20">📍 GPS: 12.9527, 101.0184</div>
              </div>
            </div>
          )}

          {/* ==========================================
              底部 3 分頁極簡導覽列
          ========================================== */}
          <nav className="fixed bottom-0 inset-x-0 z-40 bg-[#090714]/95 backdrop-blur-md border-t border-amber-500/20 px-3 py-1.5">
            <div className="max-w-xl mx-auto grid grid-cols-3 gap-2">
              <button
                onClick={() => setActiveTab('map')}
                className={`py-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs font-extrabold transition ${
                  activeTab === 'map' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'text-slate-400'
                }`}
              >
                <span>📍</span>
                <span>{t('定位地圖', 'Live Map')}</span>
              </button>
              <button
                onClick={() => setActiveTab('friends')}
                className={`py-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs font-extrabold transition ${
                  activeTab === 'friends' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'text-slate-400'
                }`}
              >
                <span>👥</span>
                <span>{t(`找隊友 (${totalHeadcount})`, `Squad (${totalHeadcount})`)}</span>
              </button>
              <button
                onClick={() => setActiveTab('guide')}
                className={`py-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs font-extrabold transition ${
                  activeTab === 'guide' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'text-slate-400'
                }`}
              >
                <span>📖</span>
                <span>{t('TML攻略＆DJ表', 'TML Guide')}</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
