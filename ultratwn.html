    // ==========================================
    // 5. 輔助工具函式
    // ==========================================
    const timeToMins = (hhmm) => {
      const [h, m] = hhmm.split(":").map(Number);
      return h * 60 + m;
    };

    const formatExactTime = (ts) => {
      if (!ts) return "--:--";
      const d = new Date(ts);
      if (isNaN(d.getTime())) return "--:--";
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    };

    const formatTimeAgo = (ts, lang) => {
      if (!ts) return "";
      const diffMins = Math.max(0, Math.floor((Date.now() - ts) / 60000));
      if (diffMins < 1) return lang === "zh" ? "剛剛" : "Just now";
      if (diffMins < 60) return lang === "zh" ? `${diffMins}分鐘前` : `${diffMins}m ago`;
      const hrs = Math.floor(diffMins / 60);
      return lang === "zh" ? `${hrs}小時前` : `${hrs}h ago`;
    };

    const getRelevantSets = (stageId, currentHHMM) => {
      const list = ULTRA_TIMETABLE[stageId];
      if (!list || list.length === 0) return [];
      const nowMins = timeToMins(currentHHMM);

      if (nowMins < timeToMins(list[0].start)) {
        return list.slice(0, 3).map((item, idx) => ({
          ...item,
          status: idx === 0 ? "NEXT 1" : idx === 1 ? "NEXT 2" : "LATER"
        }));
      }

      let currentIdx = list.findIndex(
        (item) => nowMins >= timeToMins(item.start) && nowMins < timeToMins(item.end)
      );

      if (currentIdx !== -1) {
        return list.slice(currentIdx, currentIdx + 3).map((item, idx) => ({
          ...item,
          status: idx === 0 ? "NOW" : idx === 1 ? "NEXT 1" : "NEXT 2"
        }));
      }

      return [
        {
          ...list[list.length - 1],
          status: "ENDED"
        }
      ];
    };

    // 雙錨點仿射旋轉＋縮放矩陣換算
    const latLngToMapPercent = (lat, lng) => {
      const cosLat = Math.cos((ANCHOR_A.lat * Math.PI) / 180);
      const dLat = ANCHOR_B.lat - ANCHOR_A.lat;
      const dLng = (ANCHOR_B.lng - ANCHOR_A.lng) * cosLat;
      const pLat = lat - ANCHOR_A.lat;
      const pLng = (lng - ANCHOR_A.lng) * cosLat;

      const distSq = dLat * dLat + dLng * dLng;
      const t = (pLat * dLat + pLng * dLng) / distSq;
      const n = (pLat * dLng - pLng * dLat) / distSq;

      const dMapX = ANCHOR_B.mapX - ANCHOR_A.mapX;
      const dMapY = ANCHOR_B.mapY - ANCHOR_A.mapY;

      const mapX = ANCHOR_A.mapX + t * dMapX - n * dMapY;
      const mapY = ANCHOR_A.mapY + t * dMapY + n * dMapX;

      return {
        mapX: Math.min(92, Math.max(8, Math.round(mapX * 10) / 10)),
        mapY: Math.min(72, Math.max(22, Math.round(mapY * 10) / 10))
      };
    };

    // 7. 主應用程式元件
    // ==========================================
    function App() {
      const [lang, setLang] = useState("zh");
      const [activeTab, setActiveTab] = useState("map");

      const [myProfile, setMyProfile] = useState(() => {
        try {
          const saved = localStorage.getItem("ultra_tw_2026_profile");
          return saved ? JSON.parse(saved) : { id: "u_" + Math.random().toString(36).slice(2, 8), name: "", plusOnes: 0 };
        } catch {
          return { id: "u_" + Math.random().toString(36).slice(2, 8), name: "", plusOnes: 0 };
        }
      });
      const [isEditingProfile, setIsEditingProfile] = useState(!myProfile.name);
      const [tempName, setTempName] = useState(myProfile.name || "");
      const [tempPlus, setTempPlus] = useState(myProfile.plusOnes || 0);

      const [checkins, setCheckins] = useState({});
      const [syncStatus, setSyncStatus] = useState("connecting");

      const [mapMode, setMapMode] = useState("sitemap");
      const [hybridOpacity, setHybridOpacity] = useState(0.55);
      const [customMapImg, setCustomMapImg] = useState(() => {
        try {
          return localStorage.getItem("ultra_tw_2026_custom_map") || "";
        } catch {

        }
      });
      const fileInputRef = useRef(null);

      const [selectedLandmarkId, setSelectedLandmarkId] = useState("A");
      const [selectedDj, setSelectedDj] = useState("");
      const [customDjInput, setCustomDjInput] = useState("");
      const [noteInput, setNoteInput] = useState("");
      const [selectedPinUser, setSelectedPinUser] = useState(null);

      const getRealHHMM = () => {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      };
      const [simTime, setSimTime] = useState("REAL");
      const [realTimeStr, setRealTimeStr] = useState(getRealHHMM());

      const [toastMsg, setToastMsg] = useState("");
      const [adminTapCount, setAdminTapCount] = useState(0);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState("");

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 2600);
      };

      useEffect(() => {
        const timer = setInterval(() => setRealTimeStr(getRealHHMM()), 30000);
        return () => clearInterval(timer);
      }, []);

      const activeClock = simTime === "REAL" ? realTimeStr : simTime;

      const fetchCheckins = async () => {
        try {
          const res = await fetch(`${FIREBASE_DB_URL}/${DB_NODE}/checkins.json`);
          if (!res.ok) throw new Error("Network error");
          const data = await res.json();
          setCheckins(data && typeof data === "object" ? data : {});
          setSyncStatus("live");
        } catch (err) {
          setSyncStatus("offline");
        }
      };

      useEffect(() => {
        fetchCheckins();
        const interval = setInterval(fetchCheckins, 4000);
        return () => clearInterval(interval);
      }, []);

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const cleanName = tempName.trim();
        if (!cleanName) {
          showToast(lang === "zh" ? "請先輸入你的暱稱或 IG！" : "Please enter your name or IG!");
          return;
        }
        const updated = { ...myProfile, name: cleanName, plusOnes: Number(tempPlus) || 0 };
        setMyProfile(updated);
        try {
          localStorage.setItem("ultra_tw_2026_profile", JSON.stringify(updated));
        } catch {}
        setIsEditingProfile(false);
        showToast(lang === "zh" ? `已設定身分：${cleanName}` : `Saved profile: ${cleanName}`);
      };

      const postCheckinToCloud = async (payload) => {
        if (!myProfile.name) {
          setIsEditingProfile(true);
          return;
        }
        const record = {
          userId: myProfile.id,
          name: myProfile.name,
          plusOnes: myProfile.plusOnes || 0,
          timestamp: Date.now(),
          ...payload
        };

        setCheckins((prev) => ({ ...(prev || {}), [myProfile.id]: record }));
        showToast(lang === "zh" ? "✅ 已更新你的最新位置！" : "✅ Location updated!");

        try {
          await fetch(`${FIREBASE_DB_URL}/${DB_NODE}/checkins/${myProfile.id}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(record)
          });
          setSyncStatus("live");
        } catch {
          setSyncStatus("offline");
          showToast(lang === "zh" ? "⚠️ 網路不穩，稍後自動重試" : "⚠️ Weak signal, saved locally");
        }
      };

      const handleLandmarkCheckin = () => {
        const lm = LANDMARKS.find((l) => l.id === selectedLandmarkId) || LANDMARKS[0];
        const finalDj = customDjInput.trim() || selectedDj || "";
        postCheckinToCloud({
          landmarkId: lm.id,
          mapX: lm.mapX,
          mapY: lm.mapY,
          lat: lm.lat,
          lng: lm.lng,
          dj: finalDj,
          note: noteInput.trim(),
          isGps: false
        });
      };

      const handleGpsCheckin = () => {
        if (!navigator.geolocation) {
          showToast(lang === "zh" ? "此瀏覽器不支援 GPS 定位" : "GPS not supported");
          return;
        }
        showToast(lang === "zh" ? "🛰️ 正在抓取手機 GPS 座標..." : "🛰️ Fetching GPS location...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            const { mapX, mapY } = latLngToMapPercent(latitude, longitude);
            let nearest = LANDMARKS[0];
            let minDist = Infinity;
            LANDMARKS.forEach((lm) => {
              const d = Math.hypot(lm.lat - latitude, lm.lng - longitude);
              if (d < minDist) {
                minDist = d;
                nearest = lm;
              }
            });

            const finalDj = customDjInput.trim() || selectedDj || "";
            postCheckinToCloud({
              landmarkId: nearest.id,
              mapX,
              mapY,
              lat: latitude,
              lng: longitude,
              dj: finalDj,
              note: noteInput.trim() || (lang === "zh" ? "GPS 精準定位" : "GPS Live Pin"),
              isGps: true
            });

            showToast(lang === "zh" ? "⚠️ 無法取得 GPS，請改用下方 A~F 點一鍵打卡" : "⚠️ GPS denied, use A-F buttons");

        );

      const handleRemoveMyCheckin = async () => {
        setCheckins((prev) => {
          const copy = { ...(prev || {}) };
          delete copy[myProfile.id];
          return copy;
        });
        try {
          await fetch(`${FIREBASE_DB_URL}/${DB_NODE}/checkins/${myProfile.id}.json`, { method: "DELETE" });

        showToast(lang === "zh" ? "已移除你的定位標記" : "Your pin has been removed");

      const handleAdminClearAll = async (e) => {
        e.preventDefault();
        if (adminPinInput !== ADMIN_PIN) {
          showToast(lang === "zh" ? "❌ 密碼錯誤" : "❌ Wrong PIN");
          return;

        setCheckins({});
        setShowAdminModal(false);

          await fetch(`${FIREBASE_DB_URL}/${DB_NODE}/checkins.json`, { method: "DELETE" });

        const file = e.target.files?.[0];

        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          setCustomMapImg(dataUrl);
          try {
            localStorage.setItem("ultra_tw_2026_custom_map", dataUrl);

        reader.readAsDataURL(file);

      // 過濾無效或空值紀錄，確保第二分頁渲染穩定不白屏
      const checkinList = useMemo(
        () =>
          Object.values(checkins || {})
            .filter((u) => u && typeof u === "object" && u.name)

      const copyLineReport = () => {
        if (checkinList.length === 0) {

          const djStr = u.dj ? ` [🎧 ${u.dj}]` : "";
          const noteStr = u.note ? ` - ${u.note}` : "";
          return `• ${u.name}${plusStr} @ ${lm.codeZh} ${lm.nameEn}${djStr} (${formatExactTime(u.timestamp)})${noteStr}`;
        });
        const text =
          `⚡ ULTRA TAIWAN 2026 即時位置回報 (${formatExactTime(Date.now())})\n` +
          lines.join("\n") +
          `\n📍 地圖連線：${window.location.href}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(lang === "zh" ? "📋 已複製全團位置，可直接貼上 LINE！" : "📋 Copied summary for LINE / IG!");
          });
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");

          showToast(lang === "zh" ? "📋 已複製全團位置！" : "📋 Copied!");

                  })}
                </div>

                {/* 智慧時刻表連動：顯示 NOW + 下 2 個時段 DJ */}
                {(selectedLandmarkId === "A" || selectedLandmarkId === "B") && (
                  <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-2.5 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold text-amber-300">
                        🎧 {lang === "zh" ? `2. 正在看 / 準備看哪位 DJ (${activeClock} 連動)` : `2. Watching DJ (${activeClock} Live)`}
                      </span>
                    </div>

                    <div className="space-y-1.5">
                      {relevantSets.map((item) => {
                        const isPicked = selectedDj === item.dj && !customDjInput;
                        return (
                          <button
                            key={item.dj + item.start}
                            type="button"
                            onClick={() => {
                              setSelectedDj(item.dj);
                              setCustomDjInput("");
                            }}
                            className={`w-full px-2.5 py-2 rounded-lg border flex items-center justify-between text-left transition ${
                              isPicked
                                ? "bg-amber-500/20 border-amber-400 text-white"
                                : "bg-slate-900/90 border-slate-800 text-slate-300"
                            }`}
                          >
                            <div className="flex items-center gap-2 min-w-0">
                              {item.status === "NOW" && (
                                <span className="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[9px] font-black animate-pulse shrink-0">
                                  🔴 NOW
                                </span>
                              )}
                              {item.status === "NEXT 1" && (
                                <span className="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-[9px] font-bold shrink-0">
                                  NEXT 1
                                </span>
                              )}
                              {item.status === "NEXT 2" && (
                                <span className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-[9px] font-bold shrink-0">
                                  NEXT 2
                                </span>
                              )}
                              {item.status === "ENDED" && (
                                <span className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 text-[9px] font-bold shrink-0">
                                  ENDED
                                </span>
                              )}
                              <span className="font-black text-xs truncate">{item.dj}</span>
                            </div>
                            <span className="text-[11px] font-mono text-slate-400 shrink-0 ml-2">
                              {item.start}-{item.end}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* 備註快捷標籤 + 自訂輸入 */}
                <div className="space-y-1.5">
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                    {QUICK_NOTES.map((qn) => {
                      const label = lang === "zh" ? qn.zh : qn.en;
                      return (
                        <button
                          key={qn.zh}
                          type="button"
                          onClick={() => setNoteInput(noteInput === label ? "" : label)}
                          className={`px-2 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap border ${
                            noteInput === label
                              ? "bg-cyan-500 text-slate-950 border-cyan-400"
                              : "bg-slate-950 text-slate-300 border-slate-800"
                          }`}
                        >
                          {label}
                        </button>
                      );
                    })}
                  </div>
                  <input
                    type="text"
                    value={noteInput}
                    onChange={(e) => setNoteInput(e.target.value)}
                    placeholder={lang === "zh" ? "補充備註（選填，例如：穿白色背心、在吧台旁）" : "Optional note (e.g. Wearing white tank top)"}
                    className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white focus:border-cyan-400 focus:outline-none"
                  />
                </div>

                {/* 送出打卡按鈕 */}
                <button
                  type="button"
                  onClick={handleLandmarkCheckin}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 text-slate-950 font-black text-sm shadow-lg shadow-cyan-500/20 active:scale-[0.99] transition"
                >
                  {lang === "zh"
                    ? `⚡ 立即打卡更新位置 (${LANDMARKS.find((l) => l.id === selectedLandmarkId)?.codeZh})`
                    : `⚡ Check-In Now (${LANDMARKS.find((l) => l.id === selectedLandmarkId)?.codeEn})`}
                </button>
              </div>
            </main>
          )}

          {/* ========================================== */}
          {/* TAB 2: 全團即時動態名單 (已修復防呆)        */}
          {/* ========================================== */}
          {activeTab === "crew" && (
            <main className="p-3 space-y-3">
              <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl p-3">
                <h2
                  onClick={() => {
                    const next = adminTapCount + 1;
                    if (next >= 5) {
                      setShowAdminModal(true);
                      setAdminTapCount(0);
                    } else {
                      setAdminTapCount(next);
                    }
                  }}
                  className="text-sm font-black text-cyan-300 select-none cursor-pointer"
                >
                  👥 {lang === "zh" ? `全團即時動態 (${totalHeadcount}人)` : `Live Crew Feed (${totalHeadcount} ppl)`}
                </h2>
                <div className="flex items-center gap-1.5">
                  {checkins && checkins[myProfile.id] && (
                    <button
                      type="button"
                      onClick={handleRemoveMyCheckin}
                      className="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-[11px] font-bold"
                    >
                      👋 {lang === "zh" ? "移除我的定位" : "Clear Mine"}
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={copyLineReport}
                    className="px-2.5 py-1 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold"
                  >
                    📋 {lang === "zh" ? "複製名單" : "Copy"}
                  </button>
                </div>
              </div>

              {checkinList.length === 0 ? (
                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 text-center space-y-2">
                  <div className="text-3xl">📡</div>
                  <p className="text-sm font-bold text-slate-300">
                    {lang === "zh" ? "目前還沒有人打卡定位" : "No check-ins yet"}
                  </p>
                  <p className="text-xs text-slate-500">
                    {lang === "zh" ? "切回「定位地圖」按下第一個打卡，全團手機都會即時同步看到！" : "Go to Map tab and check in first!"}
                  </p>
                </div>
              ) : (
                <div className="space-y-2">
                  {checkinList.map((u, idx) => {
                    const lm = LANDMARKS.find((l) => l.id === u.landmarkId) || LANDMARKS[0];
                    const safeLat = u.lat || lm.lat;
                    const safeLng = u.lng || lm.lng;
                    return (
                      <div
                        key={u.userId || `${u.name}_${idx}`}
                        className={`p-3 rounded-2xl border flex items-center justify-between gap-2 ${
                          u.userId === myProfile.id
                            ? "bg-cyan-950/30 border-cyan-500/40"
                            : "bg-slate-900/90 border-slate-800"
                        }`}
                      >
                        <div className="min-w-0 space-y-1">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="font-black text-sm text-white">
                              {u.name}
                              {Number(u.plusOnes) > 0 && (
                                <span className="ml-1 px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 text-[10px] font-black">
                                  +{u.plusOnes}
                                </span>
                              )}
                            </span>
                            <span className="text-[11px] font-mono text-cyan-300 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">
                              {formatExactTime(u.timestamp)} ({formatTimeAgo(u.timestamp, lang)})
                            </span>
                          </div>

                          <div className="text-xs text-slate-300 flex items-center gap-1.5 flex-wrap">
                            <span
                              className="px-1.5 py-0.5 rounded font-black text-[10px] text-slate-950"
                              style={{ backgroundColor: lm.color }}
                            >
                              {lang === "zh" ? lm.codeZh : lm.codeEn}
                            </span>
                            <span className="font-bold">{lang === "zh" ? lm.nameZh : lm.nameEn}</span>
                          </div>

                          {(u.dj || u.note) && (
                            <p className="text-xs text-slate-400">
                              {u.dj && <span className="text-amber-300 font-bold mr-2">🎧 {u.dj}</span>}
                              {u.note && <span>💬 {u.note}</span>}
                            </p>
                          )}
                        </div>

                        <a
                          href={`https://www.google.com/maps?q=${safeLat},${safeLng}`}
                          target="_blank"
                          rel="noreferrer"
                          className="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-300 text-[11px] font-bold shrink-0"
                        >
                          導航 ↗
                        </a>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* 團長隱藏密碼清空彈窗 */}
              {showAdminModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <form onSubmit={handleAdminClearAll} className="bg-slate-900 border border-rose-500/40 rounded-2xl p-5 w-full max-w-xs space-y-3">
                    <h3 className="text-sm font-black text-rose-400">🔐 團長管理員重置</h3>
                    <p className="text-xs text-slate-400">輸入管理員密碼以清空雲端所有定位紀錄：</p>
                    <input
                      type="password"
                      value={adminPinInput}
                      onChange={(e) => setAdminPinInput(e.target.value)}
                      placeholder="輸入密碼 (2026)"
                      className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                      autoFocus
                    />
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setShowAdminModal(false)}
                        className="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold"
                      >
                        取消
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-black"
                      >
                        確認清空
                      </button>
                    </div>
                  </form>
                </div>
              )}
            </main>
          )}

          {/* ========================================== */}
          {/* TAB 3: 官方完整時刻表 & 散場交通指南        */}
          {/* ========================================== */}
          {activeTab === "guide" && (
            <main className="p-3 space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-black text-cyan-300">
                    ⏰ {lang === "zh" ? "11/14 (六) 官方完整時刻表" : "NOV 14 Official Set Times"}
                  </h2>
                  <span className="text-[11px] font-bold text-slate-400">12:00 - 22:00</span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-slate-950 border border-cyan-500/30 rounded-xl p-2.5 space-y-1.5">
                    <div className="text-xs font-black text-cyan-400 border-b border-slate-800 pb-1">
                      A點 MAIN STAGE
                    </div>
                    {[...ULTRA_TIMETABLE.A].reverse().map((s) => (
                      <div key={s.dj} className="text-[11px] py-0.5 border-b border-slate-900 last:border-0">
                        <div className="font-black text-white leading-tight">{s.dj}</div>
                        <div className="text-[10px] font-mono text-cyan-300/80">{s.start} - {s.end}</div>
                      </div>
                    ))}
                  </div>

                  <div className="bg-slate-950 border border-amber-500/30 rounded-xl p-2.5 space-y-1.5">
                    <div className="text-xs font-black text-amber-400 border-b border-slate-800 pb-1">
                      B點 RESISTANCE
                    </div>
                    {[...ULTRA_TIMETABLE.B].reverse().map((s) => (
                      <div key={s.dj} className="text-[11px] py-0.5 border-b border-slate-900 last:border-0">
                        <div className="font-black text-white leading-tight">{s.dj}</div>
                        <div className="text-[10px] font-mono text-amber-300/80">{s.start} - {s.end}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2 text-xs text-slate-300">
                <h3 className="font-black text-amber-300 text-sm">🚪 大佳河濱公園・散場與基地台塞車對策</h3>
                <ul className="space-y-1.5 list-disc pl-4 text-slate-300">
                  <li>
                    <strong className="text-white">21:30～22:15 散場尖峰：</strong>大佳河濱公園 8 號 / 9 號水門基地台會嚴重塞車，建議在 <strong className="text-cyan-300">21:15 前</strong>就先約好保底集合點（預設：<strong className="text-rose-400">F點 主入口 Lockers 旁</strong>）。
                  </li>
                  <li>
                    <strong className="text-white">呼叫計程車 / Uber：</strong>水門內無法直接臨停叫車，建議步行出 <strong className="text-cyan-300">林安泰古厝（濱江街）</strong> 或 <strong className="text-cyan-300">大直橋下</strong> 再叫車會快非常多。
                  </li>
                  <li>
                    <strong className="text-white">手環儲值退費：</strong>離場前記得確認手環餘額與官方退費時限。
                  </li>
                </ul>
              </div>
            </main>
          )}

          {/* Toast 浮動通知 (pointer-events-none 避免遮擋底部導覽列點擊) */}
          {toastMsg && (
            <div className="pointer-events-none fixed bottom-20 left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full bg-slate-900 border border-cyan-400 text-xs font-bold text-white shadow-2xl whitespace-nowrap">
              {toastMsg}
            </div>
          )}

          {/* 底部三大分頁導覽列 (提高層級至 z-50 確保隨時可切換) */}
          <nav className="fixed bottom-0 left-0 right-0 z-50 max-w-lg mx-auto bg-[#07090e]/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-3 py-2 px-2">
            {[
              { id: "map", icon: "📍", zh: "定位地圖", en: "Live Map" },
              { id: "crew", icon: "👥", zh: `找隊友 (${totalHeadcount})`, en: `Crew (${totalHeadcount})` },
              { id: "guide", icon: "⏰", zh: "時刻＆攻略", en: "Set Times" }
            ].map((tab) => {
              const active = activeTab === tab.id;
              return (
                <button
                  type="button"
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center justify-center py-1 rounded-xl transition cursor-pointer ${
                    active ? "text-cyan-300 bg-cyan-500/10 font-black" : "text-slate-400 font-bold"
                  }`}
                >
                  <span className="text-base leading-none">{tab.icon}</span>
                  <span className="text-[11px] mt-1">{lang === "zh" ? tab.zh : tab.en}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
